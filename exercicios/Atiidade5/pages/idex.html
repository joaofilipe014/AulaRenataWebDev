<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 5</title>
    <style>
        :root {
            --fundo: #1f2937;
            --cartao: #0f172a;
            --texto: #f8fafc;
            --texto-secundario: #94a3b8;
            --acento: #3b82f6;
            --borda: rgba(148, 163, 184, 0.3);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--texto);
            background: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .principal {
            width: min(100%, 760px);
            background: var(--cartao);
            border-radius: 20px;
            border: 1px solid var(--borda);
            padding: 1.25rem;
        }

        .cabecalho {
            margin-bottom: 1rem;
        }

        .cabecalho h1 {
            margin: 0;
            font-size: 2rem;
        }

        .cabecalho p {
            margin: 0.5rem 0 0;
            color: var(--texto-secundario);
        }

        .formulario {
            display: grid;
            gap: 1.25rem;
        }

        .grupo-campos {
            display: grid;
            gap: 0.65rem;
        }

        .rotulo {
            font-weight: 600;
        }

        input,
        select,
        textarea,
        input[type='file'] {
            width: 100%;
            padding: 0.9rem 1rem;
            border: 1px solid var(--borda);
            border-radius: 12px;
            background: #111827;
            color: var(--texto);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus,
        select:focus,
        textarea:focus,
        input[type='file']:focus {
            outline: none;
            border-color: var(--acento);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.16);
        }

        .campos-2 {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1rem;
        }

        .escolha {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .escolha label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--texto-secundario);
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        .acoes {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .botao {
            border: none;
            border-radius: 999px;
            padding: 0.9rem 1.4rem;
            cursor: pointer;
            font-weight: 700;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .botao-primario {
            background: var(--acento);
            color: white;
        }

        .botao-secundario {
            background: rgba(148, 163, 184, 0.16);
            color: var(--texto);
        }

        .botao:hover {
            transform: translateY(-1px);
        }

        .botao-primario:hover {
            background: #2563eb;
        }

        .botao-secundario:hover {
            background: rgba(148, 163, 184, 0.28);
        }

        .nota {
            margin: 0;
            color: var(--texto-secundario);
            font-size: 0.95rem;
        }

        @media (max-width: 720px) {
            .principal {
                padding: 1rem;
            }

            .campos-2 {
                grid-template-columns: 1fr;
            }

            .acoes {
                justify-content: stretch;
            }

            .botao {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <main class="principal">
        <section class="cabecalho">
            <h1>Atividade - HTML e CSS: Formulário</h1>
            <p>Formulário centralizado, com foco, hover e layout organizado em classes em português.</p>
        </section>
        <form class="formulario">
            <div class="grupo-campos campos-2">
                <div>
                    <label for="nome" class="rotulo">Nome</label>
                    <input type="text" id="nome" name="nome" placeholder="Seu nome completo">
                </div>
                <div>
                    <label for="email" class="rotulo">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="seu@email.com">
                </div>
            </div>

            <div class="grupo-campos campos-2">
                <div>
                    <label for="senha" class="rotulo">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Senha segura">
                </div>
                <div>
                    <label for="nascimento" class="rotulo">Data de nascimento</label>
                    <input type="date" id="nascimento" name="nascimento">
                </div>
            </div>

            <div class="grupo-campos">
                <label for="curso" class="rotulo">Curso</label>
                <select id="curso" name="curso">
                    <option value="">Selecione o curso</option>
                    <option value="web">Desenvolvimento Web</option>
                    <option value="design">Design Digital</option>
                    <option value="infra">Infraestrutura</option>
                </select>
            </div>

            <div class="grupo-campos">
                <span class="rotulo">Sexo</span>
                <div class="escolha">
                    <label><input type="radio" name="sexo" value="feminino"> Feminino</label>
                    <label><input type="radio" name="sexo" value="masculino"> Masculino</label>
                    <label><input type="radio" name="sexo" value="outro"> Outro</label>
                </div>
            </div>

            <div class="grupo-campos">
                <span class="rotulo">Interesses</span>
                <div class="escolha">
                    <label><input type="checkbox" name="interesses" value="html"> HTML</label>
                    <label><input type="checkbox" name="interesses" value="css"> CSS</label>
                    <label><input type="checkbox" name="interesses" value="js"> JavaScript</label>
                    <label><input type="checkbox" name="interesses" value="ux"> UX/UI</label>
                </div>
            </div>

            <div class="grupo-campos">
                <label for="comentarios" class="rotulo">Comentários</label>
                <textarea id="comentarios" name="comentarios" placeholder="Escreva seus comentários..."></textarea>
            </div>

            <div class="grupo-campos">
                <label for="foto" class="rotulo">Upload de foto</label>
                <input type="file" id="foto" name="foto" accept="image/*">
                <p class="nota">Apenas imagens JPG ou PNG. Tamanho recomendado máximo: 2MB.</p>
            </div>

            <div class="acoes">
                <button type="reset" class="botao botao-secundario">Limpar</button>
                <button type="submit" class="botao botao-primario">Enviar</button>
            </div>
        </form>
    </main>
</body>
</html>
